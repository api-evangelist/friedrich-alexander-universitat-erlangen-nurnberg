  name: OPEN FAU OAI-PMH Metadata Service
  x-operator: institution
  description: >-
    Open Archives Initiative Protocol for Metadata Harvesting 2.0 service for
    OPEN FAU, the university's open-access publication repository. Verified live
    on 2026-08-30: Identify returns repositoryName "OPEN FAU", baseURL
    https://open.fau.de/server/oai/request, adminEmail stelica.valianos@fau.de,
    deletedRecord transient and an earliest datestamp of 1998-12-31.
    ListMetadataFormats offers eight prefixes — oai_dc, qdc, mods, didl, ore,
    mets, marc and dim — and ListRecords returns real Dublin Core carrying both
    German URN:NBN national identifiers and DOIs under FAU's own DataCite prefix.
