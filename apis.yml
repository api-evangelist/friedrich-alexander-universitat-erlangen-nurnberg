name: Friedrich-Alexander-Universität Erlangen-Nürnberg
x-type: university
x-category: Public Research University
description: >-
  Friedrich-Alexander-Universität Erlangen-Nürnberg (FAU) is a public research
  university in Erlangen and Nuremberg, Bavaria, Germany, founded in 1743 and one
  of Germany's largest, with around 39,000 students across five faculties. FAU
  operates no central developer portal and publishes no OpenAPI definition of its
  own — but unlike most of this cohort its programmable footprint is real, and
  every surface in it runs on FAU's own infrastructure: every host recorded below
  resolves inside FAU's own 131.188.0.0/16 network, and not one of them CNAMEs to
  a vendor. The institution-operated, publicly readable surfaces verified live on
  2026-08-30 are the OPEN FAU institutional repository on DSpace 7.4, which serves
  both a REST/HAL API and a fully functional OAI-PMH 2.0 harvesting endpoint with
  eight metadata crosswalks; a Matrix (Synapse 1.159.0) homeserver at
  matrix.fau.de, correctly delegated from .well-known/matrix/server and
  .well-known/matrix/client on fau.de, which makes FAU's chat service reachable
  by any standards-conformant Matrix client; the WordPress REST API behind the
  RRZE-operated FAU web platform, where the /wp-json index and search route are
  restricted but the wp/v2 content collections return real JSON on www.fau.de and
  a complete route index on ub.fau.de; and anonymous read access to the GitLab v4
  REST API on FAU's self-hosted GitLab at gitlab.rrze.fau.de, which reports 132
  public projects. Three further surfaces are live but gated: the FAU API gateway
  at api.fau.de, which fronts an authenticated API router behind SSO; the
  ClusterCockpit HPC job-monitoring REST API at monitoring.nhr.fau.de, run by
  NHR@FAU, the national high-performance computing centre FAU hosts; and the
  Clarivate Converis web service on cris.fau.de, which is FAU's research
  information system and returns HTTP 403 on its public web-service paths. FAU
  also operates a SAML 2.0 identity provider registered in the DFN-AAI federation,
  mints DOIs under its own DataCite prefix 10.25593, and maintains three active
  public GitHub organisations plus a self-hosted GitLab. No vendor contract is
  saved in this repository under FAU's name: where the software beneath a surface
  is someone else's product, the profile says so and keeps no copy of that
  product's specification.
