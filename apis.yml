- aid: friedrich-alexander-universitat-erlangen-nurnberg:fau-api-gateway
  name: FAU API Gateway (api.fau.de)
  x-operator: institution
  description: >-
    api.fau.de is an FAU-operated API portal — the browser title is "FAU API", the
    single-page application is served from FAU's own network, and its footer links
    to rrze.fau.de and www.fau.de. It is gated: the application authenticates
    through /home/auth and /login/sso, and it talks to an Apollo GraphQL client.
    Behind the SPA there is a real API router, which is provable without any
    credential — a request to /pub/v1/persons returns
    {"error":"Calling unknown API: [controller:pub, api_name:persons,
    action:index, api_version:v1]"}, exposing a controller / version / api-name /
    action routing scheme, while unrelated paths fall through to the SPA shell
    with HTTP 200. No API catalogue, no OpenAPI, and no public documentation of
    this gateway was reachable, so nothing is credited beyond its existence: this
    is a live but undocumented, credentialed institutional API surface. The
    /doc, /graphql and /openapi.json paths all return the SPA shell, which is a
    soft-200 and not a specification.
  humanURL: https://api.fau.de/
  baseURL: https://api.fau.de/
