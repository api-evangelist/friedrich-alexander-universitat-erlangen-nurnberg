- aid: friedrich-alexander-universitat-erlangen-nurnberg:wordpress-rest
  name: FAU Web Platform WordPress REST API
  x-operator: institution
  description: >-
    FAU's central web platform is a WordPress estate run by the RRZE Webteam, and
    its REST API is partly open to anonymous callers. Verified live on 2026-08-30:
    https://www.fau.de/wp-json/wp/v2/posts returns real post JSON, and
    https://ub.fau.de/wp-json/ returns the complete route index for the University
    Library site — 364 routes across 20 namespaces, including the RRZE Webteam's
    own plugin namespaces rrze-elements-blocks/v1 and rrze-video/v1, whose source
    lives in the public github.com/RRZE-Webteam organisation. The /wp-json/ index
    and the wp/v2/search route are deliberately restricted on the main sites
    ("Die Unterstützung der REST-API ist eingeschränkt", HTTP 403), so this is a
    partly-closed deployment rather than an open content API programme. The
    contract is WordPress core's; what is FAU's is the deployment, the decision to
    leave the content collections readable, and the RRZE-authored namespaces.
    Also present and NOT open: ub.fau.de exposes wp-abilities/v1 and an mcp
    namespace with three MCP servers registered by plugins, every route of which
    returns HTTP 401 rest_forbidden to an anonymous caller. It is recorded here so
    a later pass does not mistake it for a public MCP surface.
  humanURL: https://www.rrze.fau.de/
  baseURL: https://www.fau.de/wp-json/wp/v2/posts
