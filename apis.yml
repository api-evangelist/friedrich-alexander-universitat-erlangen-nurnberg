  generated: '2026-08-30'
  method: probed
  detail: >-
    Every surface class the university pipeline hunts was probed on 2026-08-30 and
    FAU comes out well above this cohort's norm: it operates several genuinely
    institution-run machine-readable surfaces rather than the usual single vendor
    contract. Four are open to anonymous callers — the OPEN FAU DSpace REST and
    OAI-PMH endpoints, the Matrix homeserver at matrix.fau.de with correct
    .well-known delegation from the apex domain, the WordPress wp/v2 content
    collections, and anonymous project reads on the self-hosted GitLab. Three more
    are live but credentialed: the api.fau.de gateway, ClusterCockpit at
    monitoring.nhr.fau.de, and the Converis web service on cris.fau.de. Identity
    federation is real and confirmed twice — FAU's SAML metadata document and its
    registration in the DFN-AAI MDQ service. DOI minting is real: prefix 10.25593
    is registered with DataCite and resolves into OPEN FAU. What is absent is
    equally clear. There is no open-data portal: data.fau.de is a Leaflet map of
    partner universities, not CKAN or Socrata, and opendata.fau.de and rdm.fau.de
    do not resolve. There is no course-catalogue API — campo.fau.de is HISinOne, a
    web application, and UnivIS was withdrawn from public access on 2025-05-15 and
    now serves an "Internal Use Only" page. faudir.fau.de, the successor
    directory, has an /api/e1/ AJAX surface that returns an empty object for every
    resource path and is not a documented API. No llms.txt exists on www.fau.de
    (404) and open.fau.de answers that path with an Anubis bot-challenge page
    under HTTP 200. No OpenAPI, AsyncAPI or apis.json document authored by FAU was
    found anywhere, which is why this repository still holds no openapi/ directory:
    the surfaces are real, the specifications for them belong to DSpace, Matrix,
    WordPress, GitLab, ClusterCockpit and Clarivate, and none of those is saved
    here under FAU's name. This profile previously listed three surfaces; it now
    lists nine, all operator-attributed, and adds three verified domain-standard
    conformances (oai-pmh, saml, datacite).
